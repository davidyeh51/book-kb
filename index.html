<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>書籍數位化知識庫</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23051C2C'/%3E%3Crect x='8' y='7' width='16' height='18' rx='1.5' fill='none' stroke='%230E9C99' stroke-width='2.4'/%3E%3Cpath d='M12 12h8M12 16h8M12 20h5' stroke='%23fff' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<!-- 外殼只放程式；書目與簡報內容全部存在 Supabase，登入且金鑰有效才讀得到 -->
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="brand-mark" aria-hidden="true"></div>
    <h1>書籍數位化知識庫</h1>
    <p class="muted">內部使用 · 需要個人帳號與存取金鑰</p>
    <label>帳號<input id="user" name="username" autocomplete="username" required></label>
    <label>存取金鑰<input id="pass" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">登入</button>
    <p id="loginMsg" class="msg" role="alert"></p>
    <p class="fine">金鑰每 60 天須更換一次；忘記金鑰請洽管理者重設。</p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <a class="brand" href="#/"><span class="brand-mark sm" aria-hidden="true"></span><span>書籍數位化知識庫</span></a>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="搜尋書名、作者、框架、關鍵字…（多個關鍵字用空白分開）" aria-label="關鍵字搜尋">
    </div>
    <nav class="menu">
      <a href="#/account" id="navAccount">我的金鑰</a>
      <a href="#/admin" id="navAdmin" hidden>帳號管理</a>
      <button id="logout" class="link">登出</button>
    </nav>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/exhibits.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
